# Canonical copy of the 1-node GMM bandit experiment.
# Also available at experiments/config.yaml for older commands.

seed: 42

arms:
  - name: optimistic
    mu: -2.0
    sigma: 0.6
    weight: 0.4
  - name: average
    mu: -1.0
    sigma: 0.6
    weight: 0.4
  - name: pessimistic
    mu: 0.0
    sigma: 0.6
    weight: 0.2

percentile: 0.95
ground_truth_n: 1000000

budget: 20000
eval_every: 200
n_replications: 5

cem:
  batch_size: 500
  elite_frac: 0.05
  smoothing: 0.7

exp3:
  gamma: 0.05

reinforce:
  learning_rate: 0.05
  baseline_alpha: 0.1

# Pavirani et al. (2026) arXiv:2608.09335: control-oriented scenario-tree
# construction. Sequential PPO assignment of a sampled fan onto the K GMM
# arms (fixed topology). Never given P(Y>v|arm).
sto_assign:
  fan_size: 128
  group_size: 8
  smoothing: 0.35
  defensive_eps: 0.1
  identity_bias: 0.0  # 0 = auto (~99% identity at init)
  hidden: 32
  ppo_lr: 0.03
  ppo_clip: 0.2
  ppo_epochs: 4
  entropy_coef: 0.02
  kl_stop: 0.05

output_dir: results/1node
