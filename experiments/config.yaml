seed: 42

arms:
  - name: optimistic
    mu: -2.0
    sigma: 0.6
    weight: 0.4
  - name: average
    mu: -1.0
    sigma: 0.6
    weight: 0.4
  - name: pessimistic
    mu: 0.0
    sigma: 0.6
    weight: 0.2

percentile: 0.95
ground_truth_n: 1000000

budget: 20000
eval_every: 200
n_replications: 5

cem:
  batch_size: 500
  elite_frac: 0.05
  smoothing: 0.7

exp3:
  gamma: 0.05

reinforce:
  learning_rate: 0.05
  baseline_alpha: 0.1

output_dir: results
